syntax = "proto3";

package anomaly_detection;

// Service definition for anomaly detection
service AnomalyDetection {
    // Score a single web request
    rpc ScoreRequest(WebRequest) returns (ScoreResponse);
    
    // Score a batch of web requests
    rpc ScoreBatch(BatchRequest) returns (BatchScoreResponse);
    
    // Update the anomaly detection threshold
    rpc UpdateThreshold(UpdateThresholdRequest) returns (UpdateThresholdResponse);
    
    // Get model information
    rpc GetModelInfo(Empty) returns (ModelInfoResponse);
}

// Web request structure
message WebRequest {
    string method = 1;          // HTTP method (GET, POST, etc.)
    string path = 2;            // Request path
    repeated KeyValue query_params = 3;  // Query parameters
    repeated KeyValue headers = 4;       // HTTP headers
    string body = 5;            // Request body (optional)
    string timestamp = 6;       // Request timestamp (optional)
    string source_ip = 7;       // Source IP address (optional)
}

// Key-value pair for headers and query parameters
message KeyValue {
    string key = 1;
    string value = 2;
}

// Response with anomaly score
message ScoreResponse {
    double score = 1;           // Anomaly score
    bool is_anomaly = 2;        // Whether this is classified as anomalous
    double threshold = 3;       // Current threshold used
    string canonical_text = 4;  // Canonicalized request text
}

// Batch request
message BatchRequest {
    repeated WebRequest requests = 1;
}

// Batch response
message BatchScoreResponse {
    repeated ScoreResponse responses = 1;
}

// Threshold update request
message UpdateThresholdRequest {
    double threshold = 1;
}

// Threshold update response
message UpdateThresholdResponse {
    bool success = 1;
    double old_threshold = 2;
    double new_threshold = 3;
}

// Model information response
message ModelInfoResponse {
    string model_name = 1;
    int64 model_parameters = 2;
    int32 vocab_size = 3;
    int32 max_sequence_length = 4;
    double current_threshold = 5;
}

// Empty message for requests that don't need parameters
message Empty {
}