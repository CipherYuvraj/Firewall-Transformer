syntax = "proto3";

package waf_inference;

// Service definition for Web Application Firewall inference
service WAFInference {
  // Score a single request for anomaly detection
  rpc Score(Request) returns (Response) {}
  
  // Batch scoring for multiple requests
  rpc BatchScore(BatchRequest) returns (BatchResponse) {}
  
  // Health check endpoint
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse) {}
}

// Single request message
message Request {
  string canonical_request = 1;
}

// Response with anomaly score and explanation
message Response {
  double score = 1;
  bool block = 2;
  repeated TokenExplain explain = 3;
  int32 status_code = 4;
  string message = 5;
}

// Token explanation for interpretability
message TokenExplain {
  string token = 1;
  double logprob = 2;
  int32 position = 3;
  double anomaly_contribution = 4;
}

// Batch request message
message BatchRequest {
  repeated string canonical_requests = 1;
}

// Batch response message
message BatchResponse {
  repeated Response responses = 1;
  int32 total_processed = 2;
  double avg_latency_ms = 3;
}

// Health check messages
message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
  string message = 2;
  string model_version = 3;
  int64 uptime_seconds = 4;
}